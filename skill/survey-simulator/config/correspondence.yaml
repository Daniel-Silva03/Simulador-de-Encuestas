# Registro de correspondencia (especificación v1.0, sección 7; v1.1, §3–§5).
#
# Asignación de campos a tipos y niveles de identificador, dónde se buscan,
# patrones de extracción, descomposición de códigos compuestos, reglas de
# resolución de conflictos mixtos y umbrales de emparejamiento.
#
# Todas las asignaciones son HIPÓTESIS: status inferred, confirmation_required
# true y confirmation null. Ninguna coincidencia de identificadores habilita
# por sí sola la comparación automática (v1.0, 7.1): hoy solo la habilita una
# declaración humana registrada y vigente.
#
# Los patrones son genéricos e inventados; no describen el formato de ningún
# cliente. Una búsqueda por patrón da una observación inferred.

version: "1.0"

identifier_levels:
  study:
    types: [study_code]
    status: inferred
    confirmation_required: true
    confirmation: null
  instrument:
    types: [instrument_id]
    status: inferred
    confirmation_required: true
    confirmation: null
  wave_or_version:
    types: [wave_label, questionnaire_version, phase_label]
    status: inferred
    confirmation_required: true
    confirmation: null

# Dónde se busca cada tipo, por documento. "field" es un campo de la IR
# (source.name, study.title, study.ids); "pattern" aplica un patrón de
# patterns: sin patrón, el valor del campo se lee tal cual (observación explicit).
locations:
  study_code:
    design:
      - {field: source.name, pattern: study_code}
      - {field: study.title, pattern: study_code}
    program:
      - {field: study.title, pattern: study_code}
      - {field: source.name, pattern: study_code}
  instrument_id:
    design:
      - {field: study.ids}
    program:
      - {field: study.ids}
  wave_label:
    design:
      - {field: source.name, pattern: wave_label}
      - {field: study.title, pattern: wave_label}
    program:
      - {field: study.title, pattern: wave_label}
      - {field: source.name, pattern: wave_label}
  questionnaire_version:
    design:
      - {field: source.name, pattern: questionnaire_version}
      - {field: study.title, pattern: questionnaire_version}
    program:
      - {field: study.title, pattern: questionnaire_version}
      - {field: source.name, pattern: questionnaire_version}
  phase_label:
    design:
      - {field: source.name, pattern: phase_label}
      - {field: study.title, pattern: phase_label}
    program:
      - {field: study.title, pattern: phase_label}
      - {field: source.name, pattern: phase_label}

patterns:
  study_code: '(?<![A-Za-z0-9])([A-Z]{2,4}[0-9]{4,8})(?![A-Za-z0-9])'
  wave_label: '(?i)(?<![A-Za-z])((?:ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPTIEMBRE|SETIEMBRE|OCTUBRE|NOVIEMBRE|DICIEMBRE)[ _-]?(?:19|20)[0-9]{2})(?![0-9])'
  questionnaire_version: '(?i)(?<![A-Za-z0-9])(V[0-9]{1,3})(?![A-Za-z0-9.])'
  phase_label: '(?i)(?<![A-Za-z])(FASE[ _-]?[0-9]{1,2})(?![0-9])'

# Descomposición de códigos compuestos: cada entrada es
#   {id, applies_to: <tipo>, regex: con grupos con nombre = tipos, status,
#    confirmation_required, confirmation}
# Sin patrón, un código se compara entero.
composite_patterns: []

# Reglas del CNC para resolver conflictos mixtos. Solo se aplican con
# status confirmed y confirmation completa. Cada entrada:
#   {id, when: {coinciden: [tipos], contradicen: [tipos]}, verdict: MISMO|DISTINTO,
#    status, confirmation_required, confirmation}
resolution_rules: []

title:
  # Palabras que se quitan antes de comparar títulos (además de todos los números).
  remove_words: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, setiembre,
                 octubre, noviembre, diciembre, ola, version, v, fase, ronda, onda, wave, edicion]
  # Proporción mínima de palabras comunes (Jaccard) para que coincidan.
  coincide_min: 0.8

matching:
  # Puntaje de contenido: enunciado, opciones (códigos y etiquetas) y tipo.
  weights: {text: 0.5, options: 0.4, type: 0.1}
  # Misma etiqueta: por debajo de este puntaje de contenido no se emparejan
  # (v1.0, 7.2: «misma etiqueta, contenido distinto»).
  label_content_min: 0.4
  # Propuesta heurística: puntaje mínimo y margen para declarar AMBIGUA.
  propose_min: 0.75
  ambiguity_margin: 0.05
  # Emparejamiento «alto» para la tabla de identidad (proporción de preguntas emparejadas).
  high_ratio: 0.5

comparison:
  # Límite de asignaciones evaluadas por par de condiciones (v1.1, §5.4).
  enumeration_limit: 10000
